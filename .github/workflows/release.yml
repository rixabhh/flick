name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_draft:
        description: 'Create an unpublished release draft when running from a v<version> tag'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      tag: ${{ steps.metadata.outputs.tag }}
      create_draft: ${{ steps.metadata.outputs.create_draft }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - id: metadata
        name: Validate source, versions and release intent
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          CREATE_RELEASE: ${{ github.ref_type == 'tag' || inputs.create_draft == true }}
        run: node scripts/validate-release.mjs --check

  browser-smoke:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/generate-model-catalog.mjs --check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build:
    needs: [validate, browser-smoke]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          # macos-13 is retired. Keep an actual Intel package on the current
          # supported GitHub-hosted runner.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            macos_deployment_target: '11.0'
          - os: macos-15
            target: aarch64-apple-darwin
            macos_deployment_target: '11.0'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install LLVM bindings on Windows x64
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install native LLVM bindings on Windows ARM64
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-23.1.0-woa64.msi'
          Invoke-WebRequest -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.0/LLVM-23.1.0-woa64.msi' -OutFile $installer
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $installer, '/qn', '/norestart') -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -notin @(0, 3010)) { throw "LLVM installer failed: $($install.ExitCode)" }
          if (-not (Test-Path -LiteralPath 'C:\Program Files\LLVM\bin\libclang.dll')) { throw 'LLVM installation did not supply libclang.dll' }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # ggml rejects MSVC for ARM. Pin the complete clang-cl target and a
          # portable CPU baseline; leaving GGML_NATIVE enabled can bake the
          # hosted runner's ARM extensions into the shipped executable.
          "CC=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_C_COMPILER=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_CXX_COMPILER=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_C_COMPILER_TARGET=aarch64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_CXX_COMPILER_TARGET=aarch64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CL=/EHsc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RC=llvm-rc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TRANSCRIBE_CMAKE_ARGS=-DGGML_NATIVE=OFF -DGGML_OPENMP=OFF" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install LLVM bindings on macOS
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Set macOS deployment target
        if: startsWith(matrix.os, 'macos')
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}" >> "$GITHUB_ENV"
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            clang \
            libclang-dev \
            libxdo-dev \
            libxtst-dev \
            libxcb-ewmh-dev \
            libxcb-randr0-dev \
            libdbus-1-dev \
            libasound2-dev \
            pkg-config

      - name: Install frontend dependencies
        run: npm ci

      # Draft/public releases must use the publisher's real Authenticode
      # certificate. Build-only runs may remain unsigned test candidates.
      - name: Import Windows code-signing certificate
        if: endsWith(matrix.target, 'pc-windows-msvc') && needs.validate.outputs.create_draft == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
            throw 'Public Windows installers require WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD, and WINDOWS_TIMESTAMP_URL secrets.'
          }
          $certificateText = Join-Path $env:RUNNER_TEMP 'flick-certificate.txt'
          $certificatePath = Join-Path $env:RUNNER_TEMP 'flick-certificate.pfx'
          Set-Content -LiteralPath $certificateText -Value $env:WINDOWS_CERTIFICATE -NoNewline
          certutil -f -decode $certificateText $certificatePath | Out-Host
          Remove-Item -LiteralPath $certificateText -Force
          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          Remove-Item -LiteralPath $certificatePath -Force
          if (-not $certificate.HasPrivateKey -or -not ($certificate.EnhancedKeyUsageList.ObjectId.Value -contains '1.3.6.1.5.5.7.3.3')) {
            throw 'The supplied certificate must include a private key and the Code Signing enhanced-key-usage extension.'
          }
          "FLICK_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FLICK_WINDOWS_TIMESTAMP_URL=$($env:WINDOWS_TIMESTAMP_URL)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'FLICK_WINDOWS_DIGEST_ALGORITHM=sha256' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Import macOS Developer ID identity
        if: endsWith(matrix.target, 'apple-darwin') && needs.validate.outputs.create_draft == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for value in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            test -n "${!value}" || { echo "Missing required signing secret: $value" >&2; exit 1; }
          done
          certificate_path="$RUNNER_TEMP/flick-developer-id.p12"
          keychain_path="$RUNNER_TEMP/flick-build.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 3600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security find-identity -v -p codesigning "$keychain_path" | grep -F "$APPLE_SIGNING_IDENTITY"
          rm -f "$certificate_path"

      - name: Verify frontend
        run: |
          npm test
          npm run build

      - name: Verify native code
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      # Package without publishing. Only the final job can create a draft,
      # after all five independent installer builds and tests have succeeded.
      - name: Build installers
        env:
          FLICK_BUILD_TARGET: ${{ matrix.target }}
          REQUIRE_MACOS_SIGNING: ${{ endsWith(matrix.target, 'apple-darwin') && needs.validate.outputs.create_draft == 'true' && 'true' || 'false' }}
          REQUIRE_WINDOWS_SIGNING: ${{ endsWith(matrix.target, 'pc-windows-msvc') && needs.validate.outputs.create_draft == 'true' && 'true' || 'false' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/build-release.mjs

      - name: Verify Windows installer signatures
        if: endsWith(matrix.target, 'pc-windows-msvc') && needs.validate.outputs.create_draft == 'true'
        shell: pwsh
        run: |
          $signTool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -ErrorAction Stop |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          $installers = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle" -Recurse -File -Include *.exe,*.msi
          if ($installers.Count -eq 0) { throw 'No Windows installers were produced for signature verification.' }
          foreach ($installer in $installers) {
            & $signTool verify /pa /all $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature validation failed: $($installer.FullName)" }
          }

      # A successful bundle command is not evidence that the app will launch
      # on a clean Mac. Verify the signed app and its stapled notarization
      # ticket before the installer is allowed into the release artifacts.
      - name: Verify macOS signing and notarization
        if: endsWith(matrix.target, 'apple-darwin') && needs.validate.outputs.create_draft == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          app="$bundle/macos/Flick.app"
          dmg=$(find "$bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -d "$app"
          test -n "$dmg"
          codesign --verify --deep --strict --verbose=4 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Test real Whisper, Moonshine and Parakeet transcription
        timeout-minutes: 20
        env:
          FLICK_BUILD_TARGET: ${{ matrix.target }}
        run: node scripts/smoke-transcription.mjs

      - name: Collect installers and SHA-256 checksums
        env:
          FLICK_BUILD_TARGET: ${{ matrix.target }}
        run: node scripts/collect-release-artifacts.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.target }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: [validate, build]
    if: needs.validate.outputs.create_draft == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: release-artifacts
          merge-multiple: true
      - name: Assemble the unpublished release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-artifacts -type f -print0)
          test "${#assets[@]}" -gt 5
          existing=$(gh release view "$RELEASE_TAG" --json isDraft -q '.isDraft' 2>/dev/null || true)
          if [ "$existing" = 'false' ]; then
            echo 'Refusing to overwrite an already published release.' >&2
            exit 1
          fi
          if [ "$existing" = 'true' ]; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --draft --prerelease --title "Flick $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
