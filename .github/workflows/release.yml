name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build:
    needs: browser-smoke
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          # macos-13 is retired. Keep an actual Intel package on the current
          # supported GitHub-hosted runner.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            macos_deployment_target: '10.15'
          - os: macos-15
            target: aarch64-apple-darwin
            macos_deployment_target: '11.0'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install LLVM bindings on Windows x64
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install native LLVM bindings on Windows ARM64
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-23.1.0-woa64.msi'
          Invoke-WebRequest -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.0/LLVM-23.1.0-woa64.msi' -OutFile $installer
          Start-Process msiexec.exe -ArgumentList @('/i', $installer, '/qn', '/norestart') -Wait -NoNewWindow
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # whisper.cpp requires clang rather than MSVC for Windows ARM64.
          "CC=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXXFLAGS=/EHsc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install LLVM bindings on macOS
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Set macOS deployment target
        if: startsWith(matrix.os, 'macos')
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}" >> "$GITHUB_ENV"
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            clang \
            libclang-dev \
            libxdo-dev \
            libxtst-dev \
            libxcb-ewmh-dev \
            libxcb-randr0-dev \
            libdbus-1-dev \
            libasound2-dev \
            pkg-config

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend
        run: |
          npm test
          npm run build

      - name: Verify native code
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Flick ${{ github.ref_name }}'
          releaseBody: |
            ## Install Flick

            Choose the installer that matches your computer:

            - **Windows x64**: Intel or AMD PCs (most Windows computers)
            - **Windows arm64**: Snapdragon / Windows on ARM PCs
            - **macOS Apple Silicon**: M-series Macs
            - **macOS Intel**: Intel-based Macs
            - **Linux x64**: Debian package for Intel/AMD Linux desktops

            An x64 MSI cannot install on Windows ARM. If Windows shows a
            processor-type message, download the asset labelled `arm64`.
          releaseDraft: true
          prerelease: true
          args: --target ${{ matrix.target }}
